name: Observability tests

on:
  pull_request:
    paths:
      - "tools/observability/**"
      - "tools/observability/tests/sql_observability_test.cpp"
      - "tools/observability/tests/script_observability_test.cpp"
      - "src/map/core_observability*"
      - "src/map/core_observability.cpp"
      - "src/map/packet_observability*"
      - "src/map/script_observability*"
      - "src/common/sql_observability*"
      - "src/common/sql.cpp"
      - "src/common/sql.hpp"
      - "src/login/login.cpp"
      - "src/char/char.cpp"
      - "src/map/map.cpp"
      - "src/map/script.cpp"
      - "src/map/script.hpp"
      - "src/web/web.cpp"
      - ".github/workflows/observability-tests.yml"
      - "docs/observability/SQL_OBSERVABILITY_V1.md"
      - "docs/observability/SCRIPT_OBSERVABILITY_V1.md"
      - "tools/performance/a3/**"
      - "docs/observability/A3_*"
      - ".github/workflows/a3-baseline-tests.yml"
  push:
    branches:
      - master
    paths:
      - "tools/observability/**"
      - "tools/observability/tests/sql_observability_test.cpp"
      - "tools/observability/tests/script_observability_test.cpp"
      - "src/map/core_observability*"
      - "src/map/core_observability.cpp"
      - "src/map/packet_observability*"
      - "src/map/script_observability*"
      - "src/common/sql_observability*"
      - "src/common/sql.cpp"
      - "src/common/sql.hpp"
      - "src/login/login.cpp"
      - "src/char/char.cpp"
      - "src/map/map.cpp"
      - "src/map/script.cpp"
      - "src/map/script.hpp"
      - "src/web/web.cpp"
      - ".github/workflows/observability-tests.yml"
      - "docs/observability/SQL_OBSERVABILITY_V1.md"
      - "docs/observability/SCRIPT_OBSERVABILITY_V1.md"
      - "tools/performance/a3/**"
      - "docs/observability/A3_*"
      - ".github/workflows/a3-baseline-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run observability unit tests
        run: python -m unittest discover -s tools/observability/tests -v
      - name: Validate example configuration
        run: python tools/observability/rathena_observer.py --config tools/observability/observer.example.json --check >/tmp/rathena-metrics.txt

  cpp-unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: windows-latest
            cxx: cl
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core observability C++ tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -Isrc/map tools/observability/tests/core_observability_test.cpp -o core_observability_test && ./core_observability_test
      - name: Build and run packet observability C++ tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -Isrc/map tools/observability/tests/packet_observability_test.cpp -o packet_observability_test && ./packet_observability_test
      - name: Build and run SQL observability C++ tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -Isrc/common tools/observability/tests/sql_observability_test.cpp -o sql_observability_test && ./sql_observability_test
      - name: Build and run SQL observability C++ runtime tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -DRATHENA_SQL_OBSERVABILITY_TESTING -Isrc -Isrc/common tools/observability/tests/sql_observability_test.cpp -o sql_observability_test_runtime && ./sql_observability_test_runtime
      - name: Build and run script observability C++ tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -Isrc/map tools/observability/tests/script_observability_test.cpp -o script_observability_test && ./script_observability_test
      - name: Build and run script observability C++ runtime tests
        if: runner.os != 'Windows'
        run: ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -DRATHENA_SCRIPT_OBSERVABILITY_TESTING -Isrc -Isrc/common -Isrc/map tools/observability/tests/script_observability_test.cpp -o script_observability_test_runtime && ./script_observability_test_runtime
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and run core observability C++ tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /Isrc\map tools\observability\tests\core_observability_test.cpp /Fe:core_observability_test.exe && .\core_observability_test.exe
      - name: Build and run packet observability C++ tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /Isrc\map tools\observability\tests\packet_observability_test.cpp /Fe:packet_observability_test.exe && .\packet_observability_test.exe
      - name: Build and run SQL observability C++ tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /Isrc\common tools\observability\tests\sql_observability_test.cpp /Fe:sql_observability_test.exe && .\sql_observability_test.exe
      - name: Build and run SQL observability C++ runtime tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /DRATHENA_SQL_OBSERVABILITY_TESTING /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\common tools\observability\tests\sql_observability_test.cpp /Fe:sql_observability_test_runtime.exe && .\sql_observability_test_runtime.exe
      - name: Build and run script observability C++ tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /Isrc\map tools\observability\tests\script_observability_test.cpp /Fe:script_observability_test.exe && .\script_observability_test.exe
      - name: Build and run script observability C++ runtime tests (MSVC)
        if: runner.os == 'Windows'
        run: cl /std:c++17 /EHsc /W4 /WX /DRATHENA_SCRIPT_OBSERVABILITY_TESTING /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\common /Isrc\map tools\observability\tests\script_observability_test.cpp /Fe:script_observability_test_runtime.exe && .\script_observability_test_runtime.exe