# A3 baseline Prometheus scrape configuration.
#
# External label placeholders are substituted by the A3 launcher at runtime
# from the approved run environment. The committed file must keep these
# placeholders verbatim; never commit real cycle, manifest, or run IDs.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    baseline_cycle_id: "${A3_BASELINE_CYCLE_ID}"
    manifest_id: "${A3_MANIFEST_ID}"
    run_id: "${A3_RUN_ID}"

scrape_configs:
  - job_name: rathena
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - 127.0.0.1:9468
  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets:
          - 127.0.0.1:9100
  - job_name: mariadb
    scrape_interval: 5s
    static_configs:
      - targets:
          - 127.0.0.1:9104
